<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#dceeff">
<title>ふくのことば 神経衰弱</title>
<style>
:root{--blue:#dceeff;--ink:#203047;--pink:#f06b91;--purple:#7550b8;--line:#d7e6f6}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#d9edff,#f8f1ff);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:var(--ink)}
header{padding:18px 14px 12px;text-align:center;background:#ffffffd9;border-bottom:3px solid #c9def7}
h1{margin:0;font-size:clamp(24px,5vw,42px);letter-spacing:.04em}
.sub{margin:6px 0 0;font-size:14px;color:#53677f}
main{max-width:1100px;margin:0 auto;padding:14px}
.top{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin:8px 0 14px}
.pill{background:white;border:2px solid #c9b8ef;border-radius:999px;padding:8px 15px;font-weight:700;box-shadow:0 2px 5px #0000000d}
button{font:inherit;cursor:pointer}
#restart{border:0;border-radius:999px;background:#7550b8;color:white;font-weight:700;padding:10px 18px;box-shadow:0 3px 0 #53378a}
#restart:active{transform:translateY(2px);box-shadow:0 1px 0 #53378a}
.note{background:#fff;border:1px solid #d6e4f5;border-radius:16px;padding:12px 15px;margin:0 auto 14px;max-width:900px;font-size:14px;line-height:1.7}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.card{border:0;background:transparent;padding:0;aspect-ratio:1/1.08;perspective:700px;min-width:0}
.inner{height:100%;width:100%;position:relative;transform-style:preserve-3d;transition:transform .28s}
.card.open .inner,.card.matched .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:15px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;overflow:hidden;border:3px solid white;box-shadow:0 3px 8px #29476624}
.back{background:repeating-linear-gradient(45deg,#5c9bd6,#5c9bd6 8px,#78b0e3 8px,#78b0e3 16px);color:white;font-size:clamp(28px,6vw,48px)}
.front{background:#fff;transform:rotateY(180deg);border-color:#f5c5d4}
.front img{width:100%;height:100%;object-fit:cover}
.word{font-size:clamp(18px,3.6vw,28px);font-weight:800;letter-spacing:.02em;padding:5px;word-break:keep-all}
.matched .front{border-color:#65c68a;box-shadow:0 0 0 3px #65c68a55}
.card:disabled{cursor:default}
#message{text-align:center;min-height:30px;font-weight:700;color:#69459f;margin:13px 0 4px}
footer{text-align:center;font-size:12px;color:#6c7e91;padding:12px}
@media(min-width:700px){.board{grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.card{aspect-ratio:1/1.05}}
@media(max-width:360px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}.card{aspect-ratio:1/1.12}}
</style>
</head>

let deck=[], first=null, lock=false, moves=0, pairs=0, seconds=0, timer=null, started=false;
const board=document.getElementById('board');
const timeEl=document.getElementById('time'), movesEl=document.getElementById('moves'), pairsEl=document.getElementById('pairs'), msg=document.getElementById('message');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}
function startTimer(){if(timer)return;timer=setInterval(()=>{seconds++;timeEl.textContent=fmt(seconds);},1000);}
function makeDeck(){
 deck=shuffle(items.flatMap((it,i)=>[
  {id:i,type:'image',content:it.image,word:it.word},
  {id:i,type:'word',content:it.word,word:it.word}
 ]));
}
function render(){
 board.innerHTML='';
 deck.forEach((c,i)=>{
  const b=document.createElement('button');b.className='card';b.type='button';b.setAttribute('aria-label','カード '+(i+1));
  b.innerHTML='<div class="inner"><div class="face back">✿</div><div class="face front">'+(c.type==='image'?'<img alt="ふくのしゃしん" src="'+c.content+'">':'<div class="word">'+c.content+'</div>')+'</div></div>';
  b.addEventListener('click',()=>flip(i,b));board.appendChild(b);
 });
}
function flip(i,b){
 if(lock||b.classList.contains('open')||b.classList.contains('matched'))return;
 if(!started){started=true;startTimer();}
 b.classList.add('open');
 if(first===null){first={i,b};return;}
 moves++;movesEl.textContent=moves;
 const a=deck[first.i], c=deck[i];
 if(a.id===c.id && a.type!==c.type){
  first.b.classList.add('matched');b.classList.add('matched');
  first.b.disabled=true;b.disabled=true;pairs++;pairsEl.textContent=pairs;
  first=null;
  if(pairs===items.length){clearInterval(timer);timer=null;msg.textContent='🎉 ぜんぶ できました！ おめでとうございます！';}
  else msg.textContent='せいかい！ つぎのペアを さがそう。';
 }else{
  lock=true;msg.textContent='ちがいます。もういちど！';
  const prev=first;first=null;
  setTimeout(()=>{prev.b.classList.remove('open');b.classList.remove('open');lock=false;},850);
 }
}
function reset(){
 if(timer)clearInterval(timer);timer=null;first=null;lock=false;moves=0;pairs=0;seconds=0;started=false;
 timeEl.textContent='00:00';movesEl.textContent='0';pairsEl.textContent='0';msg.textContent='カードを2まい めくってください。';
 makeDeck();render();
}
document.getElementById('restart').addEventListener('click',reset);
reset();
</script>
